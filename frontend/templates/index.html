<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Análise Facial em Tempo Real</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <h1>Análise Facial em Tempo Real</h1>

    <div class="mode-buttons">
      <button id="mode-webcam" type="button" class="active">Webcam</button>
      <button id="mode-upload" type="button">Upload de Arquivo</button>
    </div>

    <div class="container">
      <div id="webcam-view" class="video-container">
        <img id="camera-feed" src="/video_feed" alt="Stream da webcam" />
      </div>

      <div class="info-container">
        <img
          src="{{ url_for('static', filename='icei.png') }}"
          alt="Logomarca ICEI"
          class="logo"
        />

        <div id="info">
          <p id="age">Idade: ?</p>
          <p id="gender">Gênero: ?</p>
          <p id="emotion">Emoção: ?</p>
          <p id="ethnicity">Etnia: ?</p>
          <p id="server-ip">IP da máquina: detectando...</p>
          <div id="remote-access">
            <p id="remote-url">URL remota: detectando...</p>
            <button id="copy-remote-url" type="button" disabled>
              Copiar URL
            </button>
            <p id="remote-url-status"></p>
          </div>
          <div id="emotion_details">
            <p>Sentimentos detectados:</p>
            <ul id="emotion_details_list">
              <li>Sem dados</li>
            </ul>
          </div>
        </div>

        <form id="upload-form" enctype="multipart/form-data">
          <input id="image-file" type="file" name="file" accept="image/*" />
          <button type="submit">Enviar e analisar</button>
          <p id="status"></p>
        </form>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
