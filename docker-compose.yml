services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_DEEPFACE_MODELS: "false"
    container_name: deepface-backend
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_DEBUG: "false"
      LOG_LEVEL: INFO
      DEEPFACE_HOME: /root/.deepface
    volumes:
      - deepface_models:/root/.deepface
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepface-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  deepface_models:
